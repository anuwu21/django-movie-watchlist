{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Movie</title>
    <link rel="stylesheet" href="{% static 'movies/style.css' %}">
</head>

<body>

    <h1>Edit Movie</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title" value="{{ movie.title }}">
        <br><br>

        <label>Genre:</label>
        <input type="text" name="genre" value="{{ movie.genre }}">
        <br><br>

        <label>Year:</label>
        <input type="number" name="year" value="{{ movie.year }}">
        <br><br>

        <label>Rating:</label>
        <input type="number" step="0.1" name="rating" value="{{ movie.rating }}">
        <br><br>

        <label>Description:</label>
        <textarea name="description">{{ movie.description }}</textarea>
        <br><br>

        <label>Movie Poster:</label>
        <input type="file" name="poster">

        {% if movie.poster %}
    <p>Current Poster:</p>
    <img class="edit-poster"
         src="{{ movie.poster.url }}"
         alt="{{ movie.title }} poster">
    {% endif %}

        <label>
            <input type="checkbox" name="watched" {% if movie.watched %}checked{% endif %}>
            Watched
        </label>

        <div class="movie">

    <h1>Edit Movie</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label><br>
        <input type="text" name="title" value="{{ movie.title }}">
        <br><br>

        <label>Genre:</label><br>
        <input type="text" name="genre" value="{{ movie.genre }}">
        <br><br>

        <label>Year:</label><br>
        <input type="number" name="year" value="{{ movie.year }}">
        <br><br>

        <label>Rating:</label><br>
        <input type="number" step="0.1" name="rating" value="{{ movie.rating }}">
        <br><br>

        <label>Description:</label><br>
        <textarea name="description">{{ movie.description }}</textarea>
        <br><br>

        <label>
            <input type="checkbox" name="watched"
            {% if movie.watched %}checked{% endif %}>
            Watched
        </label>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a class="back-button" href="{% url 'movie_detail' movie.id %}">
        ← Back to Movie
    </a>

</div>

</body>
</html>
